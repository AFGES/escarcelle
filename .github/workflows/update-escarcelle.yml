name: Update Escarcelle SHA256

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    name: Check and update SHA256
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary and compute SHA256
        id: hash
        run: |
          curl -fsSL -o EscarcelleLinux https://escarcelle.net/public/cashdesk/EscarcelleLinux
          echo "new=$(sha256sum EscarcelleLinux | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Extract version from binary
        id: version
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx -d -o EscarcelleLinux.unpacked EscarcelleLinux
          python3 scripts/extract-version.py EscarcelleLinux.unpacked >> "$GITHUB_OUTPUT"

      - name: Read current SHA256
        id: current
        run: |
          echo "value=$(grep -oP 'sha256: \K\S+' net.escarcelle.Cashdesk.yaml)" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        if: steps.hash.outputs.new != steps.current.outputs.value
        run: |
          sed -i "s/sha256: ${{ steps.current.outputs.value }}/sha256: ${{ steps.hash.outputs.new }}/" net.escarcelle.Cashdesk.yaml
          sed -i 's|<release version="[^"]*" date="[^"]*"/>|<release version="${{ steps.version.outputs.VERSION }}" date="${{ steps.version.outputs.DATE }}"/>|' net.escarcelle.Cashdesk.metainfo.xml

      - name: Open pull request
        if: steps.hash.outputs.new != steps.current.outputs.value
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          add-paths: |
            net.escarcelle.Cashdesk.yaml
            net.escarcelle.Cashdesk.metainfo.xml
          commit-message: "fix: update EscarcelleLinux to ${{ steps.version.outputs.VERSION }}"
          branch: update/escarcelle-sha256
          title: "fix: update EscarcelleLinux to ${{ steps.version.outputs.VERSION }}"
          body: |
            The upstream `EscarcelleLinux` binary has changed.

            Version: `${{ steps.version.outputs.VERSION }}` (built ${{ steps.version.outputs.DATE }})

            | | Hash |
            |---|---|
            | Old | `${{ steps.current.outputs.value }}` |
            | New | `${{ steps.hash.outputs.new }}` |
