name: Build and Release Flatpak

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: net.escarcelle.Cashdesk.flatpak
          manifest-path: net.escarcelle.Cashdesk.yaml
          cache-key: flatpak-builder-${{ github.sha }}
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          gpg-keys: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: net.escarcelle.Cashdesk.flatpak
          path: net.escarcelle.Cashdesk.flatpak
          retention-days: 30

      - name: Prune OSTree repo
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          SIGN_ARGS=""
          [ -n "$GPG_KEY_ID" ] && SIGN_ARGS="--gpg-sign=$GPG_KEY_ID"
          flatpak build-update-repo --prune --prune-depth=1 $SIGN_ARGS repo

      - name: Prepare Pages content
        run: |
          mkdir -p pages-staging
          cp -a repo/. pages-staging/
          cp net.escarcelle.Cashdesk.flatpakrepo pages-staging/
          cp net.escarcelle.Cashdesk.png pages-staging/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-staging

      - name: Create or update latest rolling release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Automated rolling build from the `main` branch.
          allowUpdates: true
          removeArtifacts: true
          artifacts: net.escarcelle.Cashdesk.flatpak
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: net.escarcelle.Cashdesk.flatpak
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: flatpak
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
