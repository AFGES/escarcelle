name: Build and Release Flatpak

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: net.escarcelle.Cashdesk.flatpak
          manifest-path: net.escarcelle.Cashdesk.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: net.escarcelle.Cashdesk.flatpak
          path: net.escarcelle.Cashdesk.flatpak
          retention-days: 30

      - name: Create or update latest rolling release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Build
          body: Automated rolling build from the `main` branch.
          allowUpdates: true
          removeArtifacts: true
          artifacts: net.escarcelle.Cashdesk.flatpak
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: net.escarcelle.Cashdesk.flatpak
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
